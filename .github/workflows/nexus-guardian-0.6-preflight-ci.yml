name: nexus-guardian-0.6-preflight-ci
on:
  push:
    branches: [experiment/nexus-guardian-0.6-recovery-20261106]
    paths:
      - 'windows-pc-agent-lab/nexus-codex-autoresume/**'
      - '.github/workflows/nexus-guardian-0.6-preflight-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-safety:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build test-only native owner
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'Guardian06-Preflight.exe'
          $src = (Resolve-Path 'windows-pc-agent-lab/nexus-codex-autoresume/native/GuardianJobHost.cs').Path
          & $csc /nologo /target:exe /r:System.Core.dll ('/out:' + $exe) $src
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Native kernel containment, disabled recovery and journal policy
        env:
          NEXUS_JOBHOST_EXE: ${{ runner.temp }}\Guardian06-Preflight.exe
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/native/jobhost.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/native/guardian-chain.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/restart-gates.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/operation-journal.test.mjs
  policy-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pure restart and immutable journal contract
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/restart-gates.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/operation-journal.test.mjs
