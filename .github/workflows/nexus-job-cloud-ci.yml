name: NEXUS Job Object isolated Windows CI
on:
  push:
    branches: [experiment/nexus-job-cloud-ci-20261122]
    paths: ['.github/workflows/nexus-job-cloud-ci.yml']
permissions:
  contents: read
jobs:
  native-fixture:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: windows-pc-agent-lab/nexus-host
      - name: Run the bounded synthetic acceptance in disposable CI VM
        run: node windows-pc-agent-lab/nexus-host/job-native-acceptance.test.mjs --approved-one-shot
