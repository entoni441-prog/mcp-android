name: nexus-codex-guardian-ci

on:
  push:
    branches:
      - experiment/nexus-codex-guardian-20261106
    paths:
      - 'windows-pc-agent-lab/nexus-codex-autoresume/**'
      - '.github/workflows/nexus-codex-guardian-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-crash-rescue:
    name: Guardian crash recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression and guardian crash recovery
        run: node --test windows-pc-agent-lab/nexus-codex-autoresume/controller.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/pilot-worker.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/guardian.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/guardian-status.test.mjs
