name: Windows PC Agent v2 — isolated offline checks
on:
  push:
    branches:
      - experiment/windows-pc-agent-v2-readonly-20261031
    paths:
      - windows-pc-agent-lab/v2/**
      - .github/workflows/windows-pc-agent-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build combined v1+v2 worker without deployment
        run: node windows-pc-agent-lab/v2/build-worker.mjs
      - name: Static syntax checks
        run: |
          node --check windows-pc-agent-lab/v2/worker-v2.mjs
          node --check windows-pc-agent-lab/v2/windows-agent-v2.mjs
          node --check windows-pc-agent-lab/v2/build-worker.mjs
          node --check windows-pc-agent-lab/v2/.dist/worker-combined.mjs
          node --check windows-pc-agent-lab/v2/tests/worker-v2.test.mjs
          node --check windows-pc-agent-lab/v2/tests/integration.test.mjs
      - name: Offline security and v1 compatibility tests (mock D1; no deployment)
        run: node --test windows-pc-agent-lab/v2/tests/*.test.mjs
