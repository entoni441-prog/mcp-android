name: nexus-natural-touch
on:
  push:
    branches: [experiment/nexus-natural-touch-20261108]
    paths:
      - 'windows-pc-agent-lab/nexus-host/**'
      - 'windows-pc-agent-lab/nexus-gateway/src/**'
      - 'windows-pc-agent-lab/nexus-gateway/test/**'
      - '.github/workflows/nexus-natural-touch-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural-touch:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: {os: [windows-latest, ubuntu-latest]}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and separate model/owner capture
        working-directory: windows-pc-agent-lab/nexus-host
        run: |
          node --check gui.mjs
          node --check live.mjs
          node --check uia-script.mjs
          node --check install/os-owned-activate-natural-touch.mjs
          node --check install/schedule-os-owned-natural-touch.mjs
      - name: Host click, privacy and independent activation tests
        working-directory: windows-pc-agent-lab/nexus-host
        run: node --test natural-touch.test.mjs owner-private-live.test.mjs universal-minimize.test.mjs gui.test.mjs install/natural-touch-os-owned.test.mjs
      - name: Gateway syntax
        working-directory: windows-pc-agent-lab/nexus-gateway
        run: |
          node --check src/widget.mjs
          node --check src/catalog.mjs
          node --check src/handlers.mjs
      - name: Catalog parity
        shell: bash
        run: cmp windows-pc-agent-lab/nexus-host/catalog.mjs windows-pc-agent-lab/nexus-gateway/src/catalog.mjs
      - name: Gateway v7, fallback and private-page regression
        working-directory: windows-pc-agent-lab/nexus-gateway
        run: node --test test/widget-window-manager.test.mjs test/widget-interactive.test.mjs test/live050.test.mjs test/handlers.test.mjs test/private-frame.test.mjs
