name: nexus-guardian-realjob-readonly-ci
on:
  push:
    branches: [experiment/nexus-guardian-realjob-readonly-20261106]
    paths:
      - 'windows-pc-agent-lab/nexus-codex-autoresume/native/**'
      - '.github/workflows/nexus-guardian-realjob-readonly-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-static-safety:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile isolated native Job owner
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $src = (Resolve-Path 'windows-pc-agent-lab/nexus-codex-autoresume/native/GuardianJobHost.cs').Path
          $out = Join-Path $env:RUNNER_TEMP 'GuardianRealReadOnly.exe'
          & $csc /nologo /target:exe /r:System.Core.dll ('/out:' + $out) $src
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Static check newly introduced real CLI fixture and exact-handle runner
        run: |
          node --check windows-pc-agent-lab/nexus-codex-autoresume/native/real-readonly-fixture.mjs
          node --check windows-pc-agent-lab/nexus-codex-autoresume/native/realjob-readonly-e0.test.mjs
      - name: Native shadow no-effects regression (NO REAL CODEX IN CI)
        env:
          NEXUS_JOBHOST_EXE: ${{ runner.temp }}\GuardianRealReadOnly.exe
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/native/epoch1-shadow-chain.test.mjs
  portable-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable operation journal and refusal on IN_FLIGHT
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/operation-journal.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/restart-gates.test.mjs
