name: iPhone Reverse XCTest STAGING - unsigned compilation
on:
  push:
    branches:
      - experiment/iphone-reverse-xctest-20261122
      - experiment/iphone-xctest-ax-mainloop-20261123
      - experiment/iphone-system-ui-tap-20261123
    paths:
      - ios-reverse-staging/**
      - .github/workflows/ios-reverse-unsigned-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ios-build:
    name: Unsigned iOS XCTest compile (NO device installation)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate local Xcode project
        working-directory: ios-reverse-staging
        run: xcodegen generate
      - name: Compile generic iOS XCTest (unsigned, no account)
        working-directory: ios-reverse-staging
        run: |
          xcodebuild \
            -project ReverseIPhoneRunnerStaging.xcodeproj \
            -scheme ReverseIPhoneRunnerStaging \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ios-staging-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
      - name: Verify XCTest bundle and package unsigned IPA inputs
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/ios-staging-dd/Build/Products/Debug-iphoneos"
          test -f "$products/RunnerHost.app/Info.plist"
          test -f "$products/RunnerUITests-Runner.app/Info.plist"
          test -d "$products/RunnerUITests-Runner.app/PlugIns"
          test -f "$products/RunnerUITests-Runner.app/PlugIns/RunnerUITests.xctest/RunnerUITests"
          test -f "$products/RunnerUITests-Runner.app/RunnerUITests-Runner"
          test "$(find "$products/RunnerUITests-Runner.app/PlugIns" -maxdepth 1 -name '*.xctest' -type d | wc -l | tr -d ' ')" -eq 1
          mkdir -p "$RUNNER_TEMP/iphone-unsigned/Payload" "$RUNNER_TEMP/iphone-staging-artifacts"
          mkdir -p "$RUNNER_TEMP/iphone-unsigned/Payload/RunnerUITests-Runner.app"
          rsync -a --exclude='*.dSYM' "$products/RunnerUITests-Runner.app/" "$RUNNER_TEMP/iphone-unsigned/Payload/RunnerUITests-Runner.app/"
          (cd "$RUNNER_TEMP/iphone-unsigned" && zip -qry "$RUNNER_TEMP/iphone-staging-artifacts/RunnerUITests-Runner-UNSIGNED.ipa" Payload)
          mkdir -p "$RUNNER_TEMP/iphone-host-unsigned/Payload"
          cp -R "$products/RunnerHost.app" "$RUNNER_TEMP/iphone-host-unsigned/Payload/"
          (cd "$RUNNER_TEMP/iphone-host-unsigned" && zip -qry "$RUNNER_TEMP/iphone-staging-artifacts/RunnerHost-UNSIGNED.ipa" Payload)
          unzip -Z1 "$RUNNER_TEMP/iphone-staging-artifacts/RunnerUITests-Runner-UNSIGNED.ipa" | grep -q 'Payload/RunnerUITests-Runner.app/PlugIns/RunnerUITests.xctest/RunnerUITests'
          if unzip -Z1 "$RUNNER_TEMP/iphone-staging-artifacts/RunnerUITests-Runner-UNSIGNED.ipa" | grep -q '\.dSYM'; then
            echo '::error::Debug symbols must not be inside install staging IPA'; exit 1
          fi
          (cd "$RUNNER_TEMP/iphone-staging-artifacts" && shasum -a 256 *.ipa > SHA256SUMS.txt)
          echo 'UNSIGNED ONLY: NOT INSTALLABLE. No Apple credentials or embedded provisioning profiles.'
      - name: Upload unsigned IPA staging inputs (not signed or installable)
        uses: actions/upload-artifact@v4
        with:
          name: iphone-reverse-xctest-UNSIGNED-IPA
          path: ${{ runner.temp }}/iphone-staging-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned build inputs (not installable on phone)
        uses: actions/upload-artifact@v4
        with:
          name: iphone-reverse-xctest-UNSIGNED
          path: |
            ${{ runner.temp }}/ios-staging-dd/Build/Products/*.xctestrun
            ${{ runner.temp }}/ios-staging-dd/Build/Products/Debug-iphoneos/RunnerHost.app/**
            ${{ runner.temp }}/ios-staging-dd/Build/Products/Debug-iphoneos/RunnerUITests-Runner.app/**
          if-no-files-found: warn
          retention-days: 7
