name: iPhone Native Bootstrap STAGING - unsigned Xcode 27
on:
  push:
    branches:
      - experiment/iphone-native-bootstrap-20261127
    paths:
      - ios-reverse-staging/**
      - .github/workflows/ios-reverse-unsigned-build.yml

permissions:
  contents: read

concurrency:
  group: iphone-native-bootstrap-20261127
  cancel-in-progress: false

jobs:
  unsigned-ios-build:
    name: Native bootstrap compile (unsigned, no install)
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Require Xcode 27 or later
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK $sdk"
          test "${sdk%%.*}" -ge 27
      - name: Generate project
        working-directory: ios-reverse-staging
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Compile device XCTest without signing
        working-directory: ios-reverse-staging
        run: |
          xcodebuild \
            -project ReverseIPhoneRunnerStaging.xcodeproj \
            -scheme ReverseIPhoneRunnerStaging \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ios-staging-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
      - name: Package native Runner and enforce nested bundle identity
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/ios-staging-dd/Build/Products/Debug-iphoneos"
          work="$RUNNER_TEMP/iphone-native-package"
          out="$RUNNER_TEMP/iphone-native-artifacts"
          mkdir -p "$work/Payload/RunnerUITests-Runner.app" "$out"
          test -f "$products/RunnerUITests-Runner.app/PlugIns/RunnerUITests.xctest/RunnerUITests"
          rsync -a --exclude='*.dSYM' "$products/RunnerUITests-Runner.app/" "$work/Payload/RunnerUITests-Runner.app/"
          (cd "$work" && zip -qry "$RUNNER_TEMP/RunnerUITests-raw.ipa" Payload)
          python3 ios-reverse-staging/package_native_runner.py \
            "$RUNNER_TEMP/RunnerUITests-raw.ipa" \
            "$out/RunnerUITests-Runner-NATIVE-UNSIGNED.ipa" | tee "$out/package-report.json"
          (cd "$out" && shasum -a 256 *.ipa > SHA256SUMS.txt)
      - name: Upload unsigned native STAGING only
        uses: actions/upload-artifact@v4
        with:
          name: iphone-native-bootstrap-UNSIGNED
          path: ${{ runner.temp }}/iphone-native-artifacts/
          if-no-files-found: error
          retention-days: 7
