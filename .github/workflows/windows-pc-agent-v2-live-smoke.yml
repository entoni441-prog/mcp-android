name: Windows PC Agent v2 — public live smoke
on:
  push:
    branches:
      - experiment/windows-pc-agent-v2-readonly-20261031
    paths:
      - windows-pc-agent-lab/v2/tests/live-smoke.mjs
      - .github/workflows/windows-pc-agent-v2-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check smoke test syntax
        run: node --check windows-pc-agent-lab/v2/tests/live-smoke.mjs
      - name: Test deployed LAB endpoint (read-only/negative probes only)
        run: node windows-pc-agent-lab/v2/tests/live-smoke.mjs
