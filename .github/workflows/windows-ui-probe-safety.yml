name: Windows UI Automation local-only probe — safety checks

on:
  push:
    branches:
      - experiment/windows-pc-agent-v3-control-20261031
    paths:
      - windows-pc-agent-lab/ui-probe/**
      - .github/workflows/windows-ui-probe-safety.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win-powershell:
    name: Windows PowerShell parse and fail-closed contract
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse entire UI Automation script (without GUI access)
        shell: powershell
        run: |
          $path = (Resolve-Path 'windows-pc-agent-lab/ui-probe/inspect-allowed-window.ps1').Path
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            foreach ($issue in $errors) { Write-Host ('Parser error: ' + $issue.Message) }
            throw "PowerShell script contains invalid syntax"
          }
          $commands = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst]
          }, $true) | ForEach-Object { $_.GetCommandName() })
          foreach ($forbidden in @('Invoke-Expression','Start-Process','Invoke-RestMethod','Invoke-WebRequest','New-ItemProperty','Set-ItemProperty','Remove-Item')) {
            if ($commands -contains $forbidden) { throw ('Forbidden command: ' + $forbidden) }
          }
          $src = Get-Content -LiteralPath $path -Raw
          foreach ($required in @('IApproveLocalInspection','GetForegroundWindow','FromHandle','ControlType','AutomationId')) {
            if (-not $src.Contains($required)) { throw ('Missing safety contract: ' + $required) }
          }
          Write-Host 'UI Automation source parses; no prohibited PowerShell commands found.'
      - name: Negative test — consent absent, app never inspected
        shell: powershell
        run: |
          $raw = & powershell.exe -NoProfile -NonInteractive -File 'windows-pc-agent-lab/ui-probe/inspect-allowed-window.ps1' -App notepad
          if ($LASTEXITCODE -ne 2) { throw ('Unexpected exit code without consent: ' + $LASTEXITCODE) }
          $obj = ($raw -join [Environment]::NewLine) | ConvertFrom-Json
          if ($obj.status -ne 'blocked' -or $obj.reason -ne 'explicit_local_consent_required') {
            throw 'Consent gate did not fail closed.'
          }
          if ($obj.metadata -ne $null) { throw 'Non-consensual metadata leaked.' }
          Write-Host 'Consent-gate negative test passed.'
          $global:LASTEXITCODE = 0
      - name: Negative test — arbitrary app rejected at argument boundary
        shell: powershell
        run: |
          $src = Get-Content 'windows-pc-agent-lab/ui-probe/inspect-allowed-window.ps1' -Raw
          if (-not $src.Contains("[ValidateSet('notepad', 'calculator')]")) { throw 'Application allowlist contract missing.' }
          # Native stderr from invalid arguments is expected; GitHub PowerShell
          # treats redirected NativeCommandError as fatal, so suppress it via cmd.
          & cmd.exe /d /c 'powershell.exe -NoProfile -NonInteractive -File windows-pc-agent-lab/ui-probe/inspect-allowed-window.ps1 -App chrome 1>NUL 2>NUL'
          if ($LASTEXITCODE -eq 0) { throw 'Unallowlisted app was accepted.' }
          Write-Host 'Application allowlist rejected non-approved application.'
          $global:LASTEXITCODE = 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Strict offline UIA result schema regression tests
        shell: powershell
        run: |
          node --check windows-pc-agent-lab/ui-probe/validate-report.mjs
          node --test windows-pc-agent-lab/ui-probe/tests/validate-report.test.mjs
      - name: PowerShell consent denial through strict offline stdin adapter
        shell: powershell
        run: |
          $raw = & powershell.exe -NoProfile -NonInteractive -File 'windows-pc-agent-lab/ui-probe/inspect-allowed-window.ps1' -App notepad
          if ($LASTEXITCODE -ne 2) { throw 'Expected consent refusal from PowerShell' }
          $normalized = ($raw -join [Environment]::NewLine) | node windows-pc-agent-lab/ui-probe/validate-report-stdin.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Schema validation failed on real PowerShell output' }
          $report = ($normalized -join [Environment]::NewLine) | ConvertFrom-Json
          if ($report.status -ne 'blocked' -or $report.reason -ne 'explicit_local_consent_required') {
            throw 'Offline PowerShell-to-contract round-trip mismatch'
          }
          if ($report.metadata -ne $null) { throw 'Unexpected metadata without consent' }
          Write-Host 'Actual PowerShell refusal validated end-to-end; no Windows GUI or network touched.'
          $global:LASTEXITCODE = 0
