name: nexus-guardian-kernel-jobproof-ci
on:
  push:
    branches: [experiment/nexus-guardian-kernel-jobproof-20261106]
    paths:
      - 'windows-pc-agent-lab/nexus-codex-autoresume/native/**'
      - '.github/workflows/nexus-guardian-kernel-jobproof-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-proof:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile dedicated native owner from exact branch source
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $src = (Resolve-Path 'windows-pc-agent-lab/nexus-codex-autoresume/native/GuardianJobHost.cs').Path
          $out = Join-Path $env:RUNNER_TEMP 'GuardianNamedJob-0.7.exe'
          & $csc /nologo /target:exe /r:System.Core.dll ('/out:' + $out) $src
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Named kernel Job lifecycle including forced owner death
        env:
          NEXUS_JOBHOST_EXE: ${{ runner.temp }}\GuardianNamedJob-0.7.exe
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/native/kernel-job-proof.test.mjs
      - name: Old Win32 kernel acceptance plus real Guardian and mock CLI chain
        env:
          NEXUS_JOBHOST_EXE: ${{ runner.temp }}\GuardianNamedJob-0.7.exe
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/native/jobhost.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/native/guardian-chain.test.mjs
      - name: Durable budget and recovery-admission logic
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/recovery-admission.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/recovery-budget.test.mjs
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Previously accepted operation journal and STOP admission policy
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/recovery-admission.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/operation-journal.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/restart-gates.test.mjs
