name: nexus-host-ci
on:
  push:
    branches: [experiment/nexus-host-mcp-20261101]
    paths: ['windows-pc-agent-lab/nexus-host/**', 'windows-pc-agent-lab/nexus-gateway/**', 'windows-pc-agent-lab/v3/actions.mjs', '.github/workflows/nexus-host-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test windows-pc-agent-lab/nexus-host/server.test.mjs windows-pc-agent-lab/nexus-host/access.test.mjs windows-pc-agent-lab/nexus-host/e2e-gateway.test.mjs
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows-pc-agent-lab/nexus-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: node --test test/handlers.test.mjs test/guard-core.test.mjs
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Real MCP client (official Python SDK) against gateway with PC offline
        run: |
          pip install -q mcp
          node test/real-client/serve.mjs 8899 > serve.log 2>&1 &
          for i in $(seq 50); do grep -q ready serve.log && break; sleep 0.2; done
          python test/real-client/client.py http://127.0.0.1:8899/mcp | tee client.log
          grep -q REAL_CLIENT_OFFLINE_PASS client.log
      - name: Bundle Worker with real workers-oauth-provider (dry run, no deploy, no credentials)
        run: npx wrangler deploy --dry-run --outdir dist
      - run: ls -la dist && grep -c "ConsentGuard" dist/index.js
