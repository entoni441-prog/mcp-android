name: nexus-host-ci
on:
  push:
    branches: [experiment/nexus-host-mcp-20261101]
    paths: ['windows-pc-agent-lab/nexus-host/**', 'windows-pc-agent-lab/nexus-gateway/**', 'windows-pc-agent-lab/v3/actions.mjs', '.github/workflows/nexus-host-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test windows-pc-agent-lab/nexus-host/server.test.mjs windows-pc-agent-lab/nexus-host/access.test.mjs windows-pc-agent-lab/nexus-host/e2e-gateway.test.mjs
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows-pc-agent-lab/nexus-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: node --test test/handlers.test.mjs test/guard-core.test.mjs
      - name: Bundle Worker with real workers-oauth-provider (dry run, no deploy, no credentials)
        run: npx wrangler deploy --dry-run --outdir dist
      - run: ls -la dist && grep -c "ConsentGuard" dist/index.js
