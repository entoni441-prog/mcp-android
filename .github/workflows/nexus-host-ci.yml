name: nexus-host-ci
on:
  push:
    branches: [experiment/nexus-host-mcp-20261101, experiment/nexus-0.4.0-20261101, experiment/nexus-0.4.1-20261101, experiment/nexus-0.4.2-20261101, experiment/nexus-0.4.3-ownership-20261101, experiment/nexus-0.5.0-unified-20261101, experiment/nexus-0.5.1-cleanup-stop-20261102, experiment/nexus-0.5.2-owner-access-20261102]
    paths: ['windows-pc-agent-lab/nexus-host/**', 'windows-pc-agent-lab/nexus-gateway/**', 'windows-pc-agent-lab/v3/actions.mjs', '.github/workflows/nexus-host-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Unit + integration tests (fake GUI, real files/tasks/HTTP)
        run: node --test windows-pc-agent-lab/nexus-host/server.test.mjs windows-pc-agent-lab/nexus-host/access.test.mjs windows-pc-agent-lab/nexus-host/e2e-gateway.test.mjs windows-pc-agent-lab/nexus-host/windows.test.mjs windows-pc-agent-lab/nexus-host/gui.test.mjs windows-pc-agent-lab/nexus-host/modules.test.mjs windows-pc-agent-lab/nexus-host/capstore.test.mjs windows-pc-agent-lab/nexus-host/consent.test.mjs windows-pc-agent-lab/nexus-host/server-042.test.mjs windows-pc-agent-lab/nexus-host/server-050.test.mjs windows-pc-agent-lab/nexus-host/session.test.mjs windows-pc-agent-lab/nexus-host/cleanup-051.test.mjs windows-pc-agent-lab/nexus-host/browser-risk.test.mjs windows-pc-agent-lab/nexus-host/profile-051.test.mjs windows-pc-agent-lab/nexus-host/policy.test.mjs windows-pc-agent-lab/nexus-host/stage2-052.test.mjs windows-pc-agent-lab/nexus-host/stage3-052.test.mjs windows-pc-agent-lab/nexus-host/stage4-052.test.mjs windows-pc-agent-lab/nexus-host/r01-052.test.mjs
      - name: Egress proxy + real browser over CDP incl. SSRF/redirect/DNS negatives (Chrome on Linux, Edge on Windows)
        run: node --test --test-force-exit --test-reporter=spec windows-pc-agent-lab/nexus-host/egress-proxy.test.mjs windows-pc-agent-lab/nexus-host/browser.test.mjs
      - name: Real Java 17 Robot under Xvfb
        if: runner.os == 'Linux'
        env: {NEXUS_REAL_GUI: '1'}
        run: xvfb-run -a -s "-screen 0 1280x720x24" node --test windows-pc-agent-lab/nexus-host/robot-real.test.mjs
      - name: Real Windows desktop — robot-real
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env: {NEXUS_REAL_GUI: '1'}
        # 0.5.2: one bounded step per file, run in-process (output streams live) — a hung file can no longer hold the job for hours
        run: node --test-reporter=spec windows-pc-agent-lab/nexus-host/robot-real.test.mjs
      - name: Real Windows desktop — windows-real
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env: {NEXUS_REAL_GUI: '1'}
        # 0.5.2: one bounded step per file, run in-process (output streams live) — a hung file can no longer hold the job for hours
        run: node --test-reporter=spec windows-pc-agent-lab/nexus-host/windows-real.test.mjs
      - name: Real Windows desktop — windows-consent-real
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env: {NEXUS_REAL_GUI: '1'}
        # 0.5.2: one bounded step per file, run in-process (output streams live) — a hung file can no longer hold the job for hours
        run: node --test-reporter=spec windows-pc-agent-lab/nexus-host/windows-consent-real.test.mjs
      - name: Real Windows desktop — windows-cleanup-real
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env: {NEXUS_REAL_GUI: '1'}
        # 0.5.2: one bounded step per file, run in-process (output streams live) — a hung file can no longer hold the job for hours
        run: node --test-reporter=spec windows-pc-agent-lab/nexus-host/windows-cleanup-real.test.mjs
      - name: Real Windows desktop — windows-discover-real
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env: {NEXUS_REAL_GUI: '1'}
        # 0.5.2: one bounded step per file, run in-process (output streams live) — a hung file can no longer hold the job for hours
        run: node --test-reporter=spec windows-pc-agent-lab/nexus-host/windows-discover-real.test.mjs
      - name: Real Windows desktop — windows-r01-real
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env: {NEXUS_REAL_GUI: '1'}
        # 0.5.2: one bounded step per file, run in-process (output streams live) — a hung file can no longer hold the job for hours
        run: node --test-reporter=spec windows-pc-agent-lab/nexus-host/windows-r01-real.test.mjs
      - name: Real Windows desktop — windows
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env: {NEXUS_REAL_GUI: '1'}
        # 0.5.2: one bounded step per file, run in-process (output streams live) — a hung file can no longer hold the job for hours
        run: node --test-reporter=spec windows-pc-agent-lab/nexus-host/windows.test.mjs
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows-pc-agent-lab/nexus-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: node --test test/handlers.test.mjs test/guard-core.test.mjs test/offline.test.mjs test/live050.test.mjs
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Real MCP client (official Python SDK) against gateway with PC offline
        run: |
          pip install -q mcp
          node test/real-client/serve.mjs 8899 > serve.log 2>&1 &
          for i in $(seq 50); do grep -q ready serve.log && break; sleep 0.2; done
          export EXPECTED_TOOLS=$(node -e "import('./src/catalog.mjs').then(m=>console.log(m.TOOLS.map(t=>t.name).join(',')))")
          python test/real-client/client.py http://127.0.0.1:8899/mcp | tee client.log
          grep -q REAL_CLIENT_OFFLINE_PASS client.log
      - name: Real browser (headless Chromium) — consent form POST must reach the client callback
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          node test/browser/serve.mjs 8901 8902 > br.log 2>&1 &
          for i in $(seq 50); do grep -q ready br.log && break; sleep 0.2; done
          python test/browser/consent.py http://localhost:8901 | tee browser.log
          grep -q BROWSER_CONSENT_PASS browser.log
      - name: Bundle Worker with real workers-oauth-provider (dry run, no deploy, no credentials)
        run: npx wrangler deploy --dry-run --outdir dist
      - run: ls -la dist && grep -c "ConsentGuard" dist/index.js && grep -c "live-view-v1" dist/index.js
