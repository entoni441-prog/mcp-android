name: nexus-codex-sentinel-policy-ci

on:
  push:
    branches:
      - experiment/nexus-codex-sentinel-20261106
    paths:
      - 'windows-pc-agent-lab/nexus-codex-autoresume/**'
      - '.github/workflows/nexus-codex-sentinel-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-policy:
    name: Sentinel policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail-closed recovery decision policy
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/sentinel-policy.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/sentinel-policy-cli.test.mjs
      - name: Guardian 0.3 and Auto-Resume 0.2 regression
        run: node --test --test-concurrency=1 windows-pc-agent-lab/nexus-codex-autoresume/controller.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/pilot-worker.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/guardian.test.mjs windows-pc-agent-lab/nexus-codex-autoresume/guardian-status.test.mjs
