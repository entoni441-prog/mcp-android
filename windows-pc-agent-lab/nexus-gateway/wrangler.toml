name = "nexus-gateway"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Create once:  npx wrangler kv namespace create OAUTH_KV  → paste the id below.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_KV_ID"

# Atomic consent guard (lockout + single-use nonce). SQLite-backed DO — available on Workers Free.
[[durable_objects.bindings]]
name = "CONSENT_GUARD"
class_name = "ConsentGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConsentGuard"]
