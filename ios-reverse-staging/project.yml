name: ReverseIPhoneRunnerStaging
options:
  bundleIdPrefix: org.entoni.iosstaging
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  RunnerHost:
    type: application
    platform: iOS
    sources:
      - RunnerHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.entoni.iosstaging.runnerhost
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
  RunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RunnerUITests
    dependencies:
      - target: RunnerHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.entoni.iosstaging.runnerhost.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: RunnerHost
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "YES"
schemes:
  ReverseIPhoneRunnerStaging:
    build:
      targets:
        RunnerHost: all
        RunnerUITests: [test]
    test:
      targets:
        - RunnerUITests
